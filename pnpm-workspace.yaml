# pnpm 11+ reads these settings here rather than from the `pnpm` field in package.json.
#
# `strictDepBuilds` is on by default, so an unreviewed postinstall (esbuild)
# fails CI with ERR_PNPM_IGNORED_BUILDS. `allowBuilds` is the replacement for
# ignoredBuiltDependencies / onlyBuiltDependencies.
#
# esbuild: Vite's bundler; the postinstall selects the platform binary.
# sharp: satori OG images at /og/...png; Linux CI needs the native install.
allowBuilds:
  esbuild: true
  sharp: true
