# pnpm 10+ reads these settings here rather than from the `pnpm` field in package.json.
#
# esbuild only arrives transitively through Vite, which loads its own prebuilt
# platform package, so skipping esbuild's postinstall does not affect the build.
# Note: pnpm 12.4.1 still exits 1 with ERR_PNPM_IGNORED_BUILDS despite this
# declaration; run `pnpm approve-builds esbuild` once locally to silence it.
ignoredBuiltDependencies:
  - esbuild
