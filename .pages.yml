# Pages CMS — field names and types follow src/content.config.ts.
media:
  input: public/media
  output: /media
  categories: [image]
  rename: safe

content:
  - name: cheatsheets
    label: Cheat sheets
    type: collection
    path: src/content/cheatsheets
    format: yaml-frontmatter
    filename:
      template: "{title}.md"
      field: create
    view:
      fields: [title, kind, resource, module, unit, updated, pinned, draft]
      primary: title
      sort: [updated, title]
      default:
        sort: updated
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: string
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: updated
        label: Updated
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: kind
        label: Kind
        type: select
        default: resource
        options:
          values:
            - ultimate
            - resource
        description: ultimate = the one living sheet; resource = a book/course chapter
      - name: resource
        label: Resource
        type: string
        description: Tab key for the URL, e.g. code, tcm-help-desk, tryhackme, a-plus-core-1, linux, powershell. Required when kind is resource.
      - name: module
        label: Module / chapter
        type: string
        description: Tab label inside the resource, e.g. Ch. 1
      - name: moduleOrder
        label: Module order
        type: number
        description: Lower numbers appear first in the resource tab
      - name: unit
        label: Unit
        type: number
        description: Chapter or section number used in /resources/{key}/{unit}
      - name: category
        label: Category
        type: string
        description: e.g. git, sql, ffmpeg
      - name: pinned
        label: Pinned
        type: boolean
        default: false
      - name: body
        label: Body
        type: rich-text

  - name: explainers
    label: Explainers
    type: collection
    path: src/content/explainers
    format: yaml-frontmatter
    filename:
      template: "{title}.md"
      field: create
    view:
      fields: [title, pubDate, difficulty, draft]
      primary: title
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: string
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: pubDate
        label: Published
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updated
        label: Updated
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: difficulty
        label: Difficulty
        type: select
        options:
          values:
            - beginner
            - intermediate
            - advanced
      - name: body
        label: Body
        type: rich-text

  - name: notes
    label: Lesson Notes
    type: collection
    path: src/content/notes
    format: yaml-frontmatter
    filename:
      template: "{title}.md"
      field: create
    view:
      fields: [title, pubDate, draft]
      primary: title
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: string
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: pubDate
        label: Published
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: body
        label: Body
        type: rich-text

  - name: projects
    label: Example Projects
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename:
      template: "{title}.md"
      field: create
    view:
      fields: [title, status, origin, pubDate, draft]
      primary: title
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: string
      - name: why
        label: Why this exists
        type: text
        required: true
        description: The reason the project is being made.
      - name: origin
        label: Origin
        type: select
        default: handwritten
        options:
          values:
            - handwritten
            - ai
      - name: prompt
        label: Initial command
        type: text
        description: Required when origin is ai — the prompt that started the generation.
      - name: status
        label: Status
        type: select
        default: active
        options:
          values:
            - active
            - paused
            - shipped
            - archived
      - name: repo
        label: Repository
        type: string
        description: Full URL to the git repository
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: pubDate
        label: Published
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: body
        label: Body
        type: rich-text

  - name: labs
    label: Full Picture Projects
    type: collection
    path: src/content/labs
    format: yaml-frontmatter
    filename:
      template: "{title}.md"
      field: create
    view:
      fields: [title, series, lab, pubDate, draft]
      primary: title
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: string
      - name: series
        label: Series
        type: select
        required: true
        options:
          values:
            - powershell
            - linux
        description: powershell = Learn Windows PowerShell; linux = The Linux Command Line
      - name: lab
        label: Lab / activity
        type: string
        description: e.g. Lab 3 or Playground Ch. 4
      - name: example
        label: Example project
        type: string
        description: Filename (without .md) of the matching Example Project that holds the code
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: pubDate
        label: Published
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: body
        label: Body
        type: rich-text

settings:
  commit:
    identity: user
